name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "*.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "*.txt"

permissions:
  contents: read

jobs:
  build-and-test:
    # Release-please PRs are pushed by github-actions[bot] with GITHUB_TOKEN;
    # GitHub suppresses workflow runs for such events (anti-recursion), leaving
    # a dead 0-job "failure" record. Skip explicitly so the PR shows a clean
    # intentional skip instead of a phantom red X.
    if: "!startsWith(github.head_ref, 'release-please--')"
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app-update installer tests build and unpack real archives. The
      # unzip is injected (production uses macOS `ditto`, absent on Linux), but
      # `zip`/`unzip` themselves must exist — they ship with ubuntu-latest, yet
      # an implicit dependency on a preinstalled tool is exactly the kind of
      # thing that breaks on a runner image update.
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint
        # Warnings are advisory; only lint errors fail the job (eslint exits
        # non-zero solely on errors unless --max-warnings is set).

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: TUI smoke
        # Headless wiring check (ADR-0020): martty --check-runtime spawns the
        # built bridge and runs the ACP initialize handshake.
        run: pnpm run smoke:tui

  bun-runtime:
    # Dual-runtime path (src/runtime.ts): with Bun >=1.4 on PATH the bridge
    # re-execs into `bun --smol` — keep that path covered so Node↔Bun drift
    # is caught in CI, not in a user's editor.
    # Same release-please skip rationale as build-and-test above.
    if: "!startsWith(github.head_ref, 'release-please--')"
    name: Bun runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same rationale as the Node job: the app-update tests need real
      # `zip`/`unzip` binaries on PATH.
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build
        run: pnpm run build

      - name: Test (vitest hosted by Bun)
        run: bun x vitest run

      - name: Smoke under Bun (re-exec path)
        run: |
          bun --version
          node dist/cli.js server < /dev/null
          node dist/cli.js tui --check
